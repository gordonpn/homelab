modules:
  icmp_ipv4:
    prober: icmp
    timeout: 4s
    icmp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false

  icmp_ipv6:
    prober: icmp
    timeout: 4s
    icmp:
      preferred_ip_protocol: ip6
      ip_protocol_fallback: false

  http_2xx_ipv4:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      valid_status_codes: [200, 204]
      follow_redirects: false
      enable_http2: true

  http_2xx_ipv6:
    prober: http
    timeout: 5s
    http:
      preferred_ip_protocol: ip6
      ip_protocol_fallback: false
      valid_status_codes: [200, 204]
      follow_redirects: false
      enable_http2: true

  dns_local_ipv4:
    prober: dns
    timeout: 4s
    dns:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      transport_protocol: udp
      query_name: example.com
      query_type: A
      recursion_desired: true
      valid_rcodes: [NOERROR]

  # Defined for unrestricted external vantage points (e.g. RackNerd VPS).
  # Not scheduled from master because ASUS DNS Director blocks client TCP/853 DoT.
  tcp_dot_ipv4:
    prober: tcp
    timeout: 4s
    tcp:
      preferred_ip_protocol: ip4
      ip_protocol_fallback: false
      tls: true
      tls_config:
        server_name: family.adguard-dns.com

  tcp_dot_ipv6:
    prober: tcp
    timeout: 4s
    tcp:
      preferred_ip_protocol: ip6
      ip_protocol_fallback: false
      tls: true
      tls_config:
        server_name: family.adguard-dns.com
